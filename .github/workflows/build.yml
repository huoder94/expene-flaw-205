name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Frontend and Install Dependencies
        run: |
          if [ -d "expene-flaw-205/frontend" ]; then
            TARGET_DIR="expene-flaw-205/frontend"
          elif [ -d "frontend" ]; then
            TARGET_DIR="frontend"
          elif [ -f "package.json" ]; then
            TARGET_DIR="."
          else
            echo "Pasta do projeto não encontrada!"
            exit 1
          fi
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd $TARGET_DIR
          npm install

      - name: Build Android APK with EAS Local
        run: |
          cd ${{ env.TARGET_DIR }}
          npx eas-cli build --platform android --profile preview --local --output ./app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseFlow205-APK
          path: |
            ${{ env.TARGET_DIR }}/app-release.apk
            app-release.apk
