name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -d "expene-flaw-205/frontend" ]; then
            cd expene-flaw-205/frontend
          elif [ -d "frontend" ]; then
            cd frontend
          fi
          npm install

      - name: Build Android APK with EAS
        run: |
          if [ -d "expene-flaw-205/frontend" ]; then
            cd expene-flaw-205/frontend
          elif [ -d "frontend" ]; then
            cd frontend
          fi
          npx eas-cli build --platform android --profile preview --local --output ./app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            expene-flaw-205/frontend/app-release.apk
            frontend/app-release.apk
            app-release.apk
